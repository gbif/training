site:
  title: Учебные курсы GBIF
  start_page: ROOT::index.adoc
  keys:
    language: ru
content:
  sources:
    - url: .
      start_path: ./ru/home
      branches: HEAD
    - url: .
      start_path: ./ru/intro-to-gbif
      branches: HEAD
    - url: .
      start_path: ./ru/data-mobilization
      branches: HEAD
    - url: .
      start_path: ./ru/data-use
      branches: HEAD
    - url: .
      start_path: ./ru/dna-barcoding
      branches: HEAD
    - url: .
      start_path: ./ru/nodes
      branches: HEAD
    - url: .
      start_path: ./ru/epn
      branches: HEAD
    - url: .
      start_path: ./ru/grscicoll
      branches: HEAD
    - url: .
      start_path: ./ru/project-planning
      branches: HEAD
    - url: .
      start_path: ./ru/foundations
      branches: HEAD      
output:
  clean: false
  dir: ./output/ru
runtime:
  fetch: true
  cache_dir: ./cache
ui:
  bundle:
    url: https://builds.gbif.org/job/tech-docs-theme/lastSuccessfulBuild/artifact/build/ui-bundle.zip
    snapshot: true
  supplemental_files: ./supplemental_ui
urls:
  html_extension_style: drop
  latest_version_segment_strategy: redirect:to
  latest_version_segment: latest
  redirect_facility: httpd
asciidoc:
  extensions:
  - ./lib/asciidoctor-question
  attributes:
    idprefix: ''
    idseparator: '-'
    page-pagination: yes
    page-toctitle: 'Содержимое страницы'
    language: ru
    null: ␀
antora:
  extensions:
  - require: '@antora/lunr-extension'
    index_latest_only: true
    languages: [ru]
